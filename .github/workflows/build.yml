# Cloudflare deploys committed _site/ directly. This workflow validates Astro,
# uploads the built site, and repairs stale committed output on main if needed.
name: Build site

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      browser_tests:
        description: Run the optional Chromium browser and accessibility suite
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: "build-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check Astro and TypeScript
        run: npm run check

      - name: Build and audit public output
        run: npm run build

      # Site-contract tests inspect _site/, so build before running tests.
      - name: Run unit and output-contract tests
        run: npm test

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

      # Commit source and its rebuilt _site/ together whenever possible. This
      # fallback does nothing when the checked-in output already matches, so
      # the normal path needs only one Cloudflare deployment. A repair commit
      # triggers a second Cloudflare deployment, not a second Actions run.
      # Do not add a CI-skip marker: Cloudflare honors those markers too.
      - name: Commit rebuilt site only if output changed
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git add -f _site
          if git diff --cached --quiet; then
            echo "_site already matches the source; no extra commit or deployment"
            exit 0
          fi
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "main has advanced; leave output sync to the newer build"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: rebuild _site"
          git push origin HEAD:main

  # Run UI checks on every PR; main runs can opt in through Actions. Keep
  # browser results separate from the Node build so both outcomes are visible.
  browser:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.browser_tests)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build site for browser tests
        run: npm run build

      - name: Run browser and accessibility tests
        run: npm run test:e2e

      - name: Upload browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: warn
