# Build check only. Deployment is handled by Cloudflare Workers, which builds
# this repo itself on every push to main. This workflow exists so a broken
# Liquid tag, bad YAML frontmatter, or a missing include fails here on the PR
# rather than in the Cloudflare dashboard after it has already gone live.
name: Build site

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "build-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          # Kept in step with .ruby-version, which pins the Cloudflare build.
          ruby-version: '3.2.2'
          bundler-cache: true

      - name: Build with Jekyll
        # No --baseurl override: the site is served from the domain root on
        # Cloudflare Workers, so _config.yml (baseurl: "") is already correct.
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
          # jekyll-remote-theme pulls pages-themes/cayman from the GitHub API.
          # Without a token the build shares an anonymous rate limit and can
          # fail intermittently.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check key pages were generated
        run: |
          for f in _site/index.html _site/en/index.html _site/hi/index.html \
                   _site/404.html _site/sitemap.xml _site/_headers; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
          # wrangler.jsonc has no frontmatter, so a missing exclude: entry
          # would publish the deploy config as part of the site.
          test ! -e _site/wrangler.jsonc || { echo "wrangler.jsonc leaked into _site"; exit 1; }
          # Internal notes and tooling must not be published as site pages.
          for leak in AUDIT_REPORT.md FIX_SUMMARY.md MODERNIZATION_SUMMARY.md                       QUICK_START_WINDOWS.md remove_bg.mjs scripts tests; do
            test ! -e "_site/$leak" || { echo "$leak leaked into _site"; exit 1; }
          done
          echo "built $(find _site -type f | wc -l) files"

      # Makes the built site downloadable with `gh run download`, so it can be
      # deployed with `npx wrangler deploy` from a machine that has no Ruby.
      # Not needed once Workers Builds is connected to the repo.
      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site/
          include-hidden-files: true
          retention-days: 7
