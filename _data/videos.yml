# Short clips for the design, in assets/media/videos/<id>-720.mp4:
# 1280x720 H.264 with +faststart, 12-16 s, metadata stripped (no GPS or
# device details). Sources: the school's Google Photos albums Sports Day
# 2026, Inter House Dance Competition 2025 and Veer Patta Cultural 2026.
#
# clips: tap-to-play cards (_includes/design/video.html). poster is a photo
#   id in _data/photos.yml; duration and size are shown on the card so
#   parents on phone data know what a tap costs.
# slots: hero is the silent desktop-only background loop (no card), tour
#   the campus-film band on the home page (the hero's second button jumps
#   to it), life the home mosaic, gallery the Videos band on the gallery page.
#
# campus-tour is not cut from footage: it is a 45 s film rendered from the
# graded campus photos (scripts/photos-manifest.json) plus 3 s each of the
# house-dance and sports-day clips, with English + Hindi captions burned in.
# 1280x720, H.264 CRF 29, no audio, metadata stripped.

clips:
  campus-tour:
    poster: video-campus-tour
    duration: "0:45"
    size: "5.0 MB"
    caption:
      en: "Campus film: entrance, reception, verandas, classrooms, labs and lawns"
      hi: "कैंपस फ़िल्म: प्रवेश द्वार, स्वागत कक्ष, बरामदे, कक्षाएँ, प्रयोगशालाएँ और लॉन"
  sports-day:
    poster: video-sports-day
    duration: "0:15"
    size: "3.0 MB"
    caption:
      en: "Sports Day 2026: students sprint to the finish line"
      hi: "खेल दिवस 2026: फ़िनिश लाइन की ओर दौड़ते विद्यार्थी"
  house-dance:
    poster: video-house-dance
    duration: "0:13"
    size: "3.0 MB"
    caption:
      en: "Inter-house dance competition 2025 on the school lawn"
      hi: "विद्यालय के लॉन पर अंतर-सदनीय नृत्य प्रतियोगिता 2025"
  cultural-stage:
    poster: video-cultural-stage
    duration: "0:12"
    size: "2.3 MB"
    caption:
      en: "Independence Day programme: students in costume and a stage dance"
      hi: "स्वतंत्रता दिवस कार्यक्रम: वेशभूषा में विद्यार्थी और मंच पर नृत्य"

slots:
  hero: hero-loop
  tour: campus-tour
  life: sports-day
  gallery: [campus-tour, sports-day, house-dance, cultural-stage]
